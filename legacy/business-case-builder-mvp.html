<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Case Builder — MARKT-PILOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F4F3F0;
    --white:#FFFFFF;
    --navy:#1B2A47;
    --navy-light:#2C3E63;
    --gold:#C9A24B;
    --gold-light:#E4C878;
    --brick:#9C4A3A;
    --text:#262A33;
    --text-muted:#6B7280;
    --border:#E3E1DB;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:var(--font-body);
    background:var(--cream);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  *:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:2px;}

  /* ---------- shell layout ---------- */
  .shell{
    min-height:100vh;
    display:grid;
    grid-template-columns:250px 1fr;
    grid-template-rows:70px 1fr;
    grid-template-areas:"topbar topbar" "sidebar main";
  }
  @media(max-width:860px){
    .shell{grid-template-columns:1fr; grid-template-rows:70px auto 1fr; grid-template-areas:"topbar" "sidebar" "main";}
    .sidebar{flex-direction:row; overflow-x:auto; padding:10px 14px; gap:8px; align-items:center;}
    .sidebar .progress-wrap{display:none;}
    .sidebar .step-item{flex:0 0 auto; white-space:nowrap;}
    .sidebar .step-item .step-desc{display:none;}
  }

  /* ---------- topbar ---------- */
  .topbar{
    grid-area:topbar;
    background:var(--navy);
    color:var(--white);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    gap:16px;
  }
  .topbar .brand{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.15rem;
    letter-spacing:.01em;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .topbar .brand small{
    font-family:var(--font-mono);
    font-size:.65rem;
    color:var(--gold-light);
    font-weight:500;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .topbar .controls{display:flex; align-items:center; gap:10px;}
  .topbar select{
    background:var(--navy-light);
    color:var(--white);
    border:1px solid rgba(255,255,255,.18);
    border-radius:6px;
    padding:7px 10px;
    font-family:var(--font-body);
    font-size:.82rem;
    max-width:210px;
  }
  .topbar button{
    font-family:var(--font-body);
    font-size:.82rem;
    font-weight:600;
    border-radius:6px;
    padding:7px 12px;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s ease, border-color .15s ease;
  }
  .btn-ghost{background:transparent; color:var(--white); border:1px solid rgba(255,255,255,.3) !important;}
  .btn-ghost:hover{border-color:var(--gold) !important; color:var(--gold-light);}
  .save-status{
    font-family:var(--font-mono);
    font-size:.68rem;
    color:rgba(255,255,255,.65);
    white-space:nowrap;
    display:flex;
    align-items:center;
  }
  .save-dot{width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:7px; background:var(--gold-light); transition:background .3s ease;}
  .save-dot.saving{animation:pulse 1s ease-in-out infinite;}
  .save-dot.error{background:var(--brick);}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.3;}}

  /* ---------- sidebar ---------- */
  .sidebar{
    grid-area:sidebar;
    background:var(--white);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:20px 12px;
    gap:4px;
  }
  .progress-wrap{padding:2px 12px 16px;}
  .progress-track{background:var(--border); height:4px; border-radius:2px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--gold); border-radius:2px; transition:width .4s ease;}
  .progress-label{font-family:var(--font-mono); font-size:.66rem; color:var(--text-muted); margin-top:7px;}

  .step-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:11px 12px;
    border-radius:8px;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s ease;
  }
  .step-item:hover{background:var(--cream);}
  .step-item.active{background:var(--navy); border-color:var(--navy);}
  .step-num{
    font-family:var(--font-mono);
    font-size:.72rem;
    font-weight:600;
    color:var(--gold);
    padding-top:2px;
    min-width:14px;
  }
  .step-item.active .step-num{color:var(--gold-light);}
  .step-item.visited .step-num{color:var(--navy); opacity:.5;}
  .step-title{font-size:.86rem; font-weight:600; color:var(--text);}
  .step-item.active .step-title{color:var(--white);}
  .step-desc{font-size:.72rem; color:var(--text-muted); margin-top:2px; line-height:1.3;}
  .step-item.active .step-desc{color:rgba(255,255,255,.6);}

  /* ---------- main ---------- */
  .main{
    grid-area:main;
    padding:32px 40px 60px;
    overflow-y:auto;
  }
  @media(max-width:600px){.main{padding:20px 16px 40px;}}
  .step-panel{
    max-width:920px;
    margin:0 auto;
  }
  .step-content{animation:fadeSlideIn .4s ease;}
  @keyframes fadeSlideIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  @media(prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}

  /* ---------- live ROI bar ---------- */
  .live-bar{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--white);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 20px;
    margin-bottom:24px;
    display:flex;
    align-items:center;
    gap:26px;
    flex-wrap:wrap;
    box-shadow:0 4px 16px rgba(27,42,71,.06);
  }
  .live-bar-item{display:flex; flex-direction:column; gap:2px;}
  .live-bar-item .lb-label{font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted);}
  .live-bar-item .lb-value{font-family:var(--font-mono); font-size:1.05rem; font-weight:600; color:var(--navy);}
  .live-bar-item .lb-value.gold{color:var(--gold);}
  .live-bar-empty{font-size:.82rem; color:var(--text-muted); font-style:italic;}

  .eyebrow{
    font-family:var(--font-mono);
    font-size:.72rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--brick);
    font-weight:600;
    margin-bottom:6px;
  }
  h1.panel-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.9rem;
    color:var(--navy);
    margin-bottom:6px;
  }
  .panel-sub{color:var(--text-muted); font-size:.92rem; margin-bottom:28px; max-width:60ch;}

  .card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px 24px;
    margin-bottom:18px;
    transition:box-shadow .2s ease;
  }
  .card:hover{box-shadow:0 3px 14px rgba(27,42,71,.05);}
  .card-title{
    font-weight:700;
    font-size:.95rem;
    color:var(--navy);
    margin-bottom:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .field-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:600px){.field-grid{grid-template-columns:1fr;}}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:.76rem; font-weight:600; color:var(--text-muted);}
  .field input[type=text], .field input[type=number], .field input[type=date], .field textarea{
    font-family:var(--font-body);
    font-size:.9rem;
    padding:9px 11px;
    border:1px solid var(--border);
    border-radius:7px;
    background:var(--cream);
    color:var(--text);
    transition:background .15s ease, border-color .15s ease;
  }
  .field input:focus, .field textarea:focus{background:var(--white); border-color:var(--navy);}
  .field textarea{resize:vertical; min-height:64px; font-family:var(--font-body);}
  .placeholder-note{
    font-family:var(--font-mono);
    font-size:.68rem;
    color:var(--gold);
    background:rgba(201,162,75,.12);
    border:1px solid rgba(201,162,75,.35);
    padding:6px 10px;
    border-radius:6px;
    display:inline-block;
    margin-top:12px;
  }

  /* quick-apply slider */
  .quick-apply{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    margin-bottom:18px;
    padding:14px 16px;
    background:var(--cream);
    border-radius:9px;
    border:1px solid var(--border);
  }
  .quick-apply label{font-size:.8rem; font-weight:600; color:var(--navy); white-space:nowrap;}
  .quick-apply input[type=range]{flex:1; min-width:120px; accent-color:var(--navy);}
  .quick-apply .qa-pct{font-family:var(--font-mono); font-weight:700; color:var(--gold); min-width:34px;}
  .quick-apply button{
    background:var(--navy); color:var(--white); border:none; border-radius:7px;
    padding:8px 14px; font-size:.8rem; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .quick-apply button:hover{background:var(--navy-light);}

  /* process step rows */
  .steps-table{display:flex; flex-direction:column; gap:8px;}
  .steps-row{
    display:grid;
    grid-template-columns:1fr 130px 36px;
    gap:10px;
    align-items:center;
  }
  .steps-row.two-col{grid-template-columns:1fr 120px 120px 36px; align-items:start;}
  @media(max-width:600px){.steps-row, .steps-row.two-col{grid-template-columns:1fr; gap:6px; padding-bottom:10px; border-bottom:1px solid var(--border);}}
  .steps-row input[type=text]{width:100%;}
  .steps-row input[type=number]{width:100%; text-align:right; font-family:var(--font-mono);}
  .row-warning{grid-column:1/-1; color:var(--brick); font-size:.7rem; font-weight:600; margin-top:-2px;}
  .remove-row{
    background:none; border:none; color:var(--text-muted); cursor:pointer;
    font-size:1.1rem; line-height:1; width:32px; height:32px; border-radius:6px;
  }
  .remove-row:hover{background:rgba(156,74,58,.1); color:var(--brick);}
  .add-row-btn{
    align-self:flex-start;
    margin-top:6px;
    background:none;
    border:1px dashed var(--border);
    color:var(--navy);
    font-size:.82rem;
    font-weight:600;
    padding:8px 14px;
    border-radius:7px;
    cursor:pointer;
  }
  .add-row-btn:hover{border-color:var(--navy); background:var(--cream);}
  .col-label{font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted);}
  .col-headers{display:grid; grid-template-columns:1fr 130px 36px; gap:10px; margin-bottom:4px;}
  .col-headers.two-col{grid-template-columns:1fr 120px 120px 36px;}
  @media(max-width:600px){.col-headers{display:none;}}

  /* summary strip within a step */
  .summary-strip{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:16px;
    margin-top:4px;
  }
  .summary-stat{padding:6px 0;}
  .summary-stat .label{font-size:.72rem; color:var(--text-muted); font-weight:600; margin-bottom:4px;}
  .summary-stat .value{font-family:var(--font-mono); font-size:1.25rem; font-weight:600; color:var(--navy);}
  .summary-stat .value.gold{color:var(--gold);}
  .summary-stat .value.brick{color:var(--brick);}

  /* comparison rows (step 4) */
  .cmp-row{
    display:grid;
    grid-template-columns:190px 1fr 26px 1fr 90px;
    align-items:center;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid var(--border);
  }
  .cmp-row:last-child{border-bottom:none;}
  @media(max-width:700px){.cmp-row{grid-template-columns:1fr; gap:4px; padding:12px 0;}}
  .cmp-name{font-size:.84rem; font-weight:600; color:var(--text);}
  .cmp-bar-track{background:var(--cream); border-radius:5px; height:10px; overflow:hidden; position:relative;}
  .cmp-bar-fill{height:100%; border-radius:5px; transition:width .5s ease;}
  .cmp-bar-fill.without{background:var(--brick);}
  .cmp-bar-fill.with{background:var(--navy);}
  .cmp-arrow{text-align:center; color:var(--text-muted); font-size:.9rem;}
  .cmp-val{font-family:var(--font-mono); font-size:.7rem; color:var(--text-muted); margin-top:3px; display:block;}
  .cmp-delta{font-family:var(--font-mono); font-size:.78rem; font-weight:600; color:var(--gold); text-align:right;}

  .agg-compare{display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:8px;}
  @media(max-width:600px){.agg-compare{grid-template-columns:1fr;}}
  .agg-block .agg-label{font-size:.76rem; font-weight:700; color:var(--text-muted); margin-bottom:10px; text-transform:uppercase; letter-spacing:.04em;}
  .agg-bar-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .agg-bar-name{width:80px; font-size:.74rem; color:var(--text-muted); flex-shrink:0;}
  .agg-bar-track{flex:1; background:var(--cream); border-radius:6px; height:22px; overflow:hidden;}
  .agg-bar-fill{height:100%; display:flex; align-items:center; padding:0 8px; font-family:var(--font-mono); font-size:.72rem; color:var(--white); font-weight:600; transition:width .6s ease; white-space:nowrap;}
  .agg-bar-fill.without{background:var(--brick);}
  .agg-bar-fill.with{background:var(--navy);}

  .hero-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-top:22px;}
  .hero-stat{
    background:var(--white); border:1px solid var(--border); border-radius:12px;
    padding:20px; text-align:left; position:relative; overflow:hidden;
    transition:box-shadow .2s ease;
  }
  .hero-stat:hover{box-shadow:0 4px 16px rgba(27,42,71,.07);}
  .hero-stat::after{content:''; position:absolute; bottom:0; left:20px; right:20px; height:3px; background:var(--gold); border-radius:2px;}
  .hero-stat .hs-label{font-size:.74rem; color:var(--text-muted); font-weight:600; margin-bottom:8px;}
  .hero-stat .hs-value{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:2.1rem; color:var(--navy);}
  .hero-stat .hs-unit{font-family:var(--font-body); font-style:normal; font-size:1rem; color:var(--text-muted); margin-left:4px;}

  /* risks */
  .risk-item{display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--border);}
  .risk-item:last-child{border-bottom:none;}
  .risk-item input[type=checkbox]{margin-top:4px; width:16px; height:16px; accent-color:var(--navy); flex-shrink:0;}
  .risk-body{flex:1; display:flex; flex-direction:column; gap:6px;}
  .risk-body input[type=text].risk-name{font-weight:700; font-size:.88rem; border:none; background:none; padding:2px 0; color:var(--text);}
  .risk-body textarea.risk-mit{font-size:.82rem; color:var(--text-muted); border:none; background:none; padding:2px 0; min-height:38px; resize:vertical;}
  .risk-body input.risk-name:focus, .risk-body textarea.risk-mit:focus{background:var(--cream); border-radius:5px; padding:4px 6px;}

  /* roadmap */
  .roadmap-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  @media(max-width:760px){.roadmap-grid{grid-template-columns:1fr;}}
  .roadmap-card{background:var(--cream); border-radius:10px; padding:16px; border-top:3px solid var(--gold);}
  .roadmap-phase{font-family:var(--font-mono); font-size:.68rem; color:var(--brick); font-weight:700; text-transform:uppercase; letter-spacing:.05em;}
  .roadmap-card input.rm-title{font-family:var(--font-display); font-weight:600; font-size:1.1rem; border:none; background:none; width:100%; margin:4px 0 2px; color:var(--navy);}
  .roadmap-card input.rm-duration{font-size:.74rem; color:var(--text-muted); border:none; background:none; width:100%; font-family:var(--font-mono); margin-bottom:8px;}
  .roadmap-card textarea.rm-desc{font-size:.8rem; border:none; background:none; width:100%; min-height:70px; resize:vertical; color:var(--text); line-height:1.4;}
  .roadmap-card input:focus, .roadmap-card textarea:focus{background:var(--white); border-radius:5px; padding:3px 5px;}

  /* closing strip */
  .closing-strip{
    background:var(--navy);
    color:var(--white);
    border-radius:14px;
    padding:30px 32px;
    margin-top:26px;
  }
  .closing-strip .eyebrow{color:var(--gold-light);}
  .closing-strip h2{font-family:var(--font-display); font-weight:600; font-size:1.5rem; margin-bottom:20px;}
  .closing-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:20px; margin-bottom:24px;}
  .closing-stat .cs-label{font-size:.72rem; color:rgba(255,255,255,.55); font-weight:600; margin-bottom:6px;}
  .closing-stat .cs-value{font-family:var(--font-mono); font-size:1.7rem; font-weight:600; color:var(--gold-light);}
  .next-step-field{display:flex; flex-direction:column; gap:6px; margin-bottom:20px;}
  .next-step-field label{font-size:.72rem; color:rgba(255,255,255,.55); font-weight:600;}
  .next-step-field input{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.25);
    border-radius:7px;
    padding:10px 12px;
    color:var(--white);
    font-family:var(--font-body);
    font-size:.9rem;
  }
  .next-step-field input::placeholder{color:rgba(255,255,255,.4);}
  .btn-on-navy{
    background:rgba(255,255,255,.1); color:var(--white); border:1px solid rgba(255,255,255,.3);
    border-radius:7px; padding:9px 16px; font-size:.82rem; font-weight:600; cursor:pointer;
  }
  .btn-on-navy:hover{background:rgba(255,255,255,.18);}
  .summary-fallback{
    width:100%; margin-top:12px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.25);
    border-radius:8px; color:var(--white); font-family:var(--font-mono); font-size:.72rem; padding:10px;
    min-height:130px; display:none; line-height:1.5;
  }
  .summary-fallback.visible{display:block;}
  .fallback-note{font-size:.68rem; color:rgba(255,255,255,.5); margin-top:6px; display:none;}
  .fallback-note.visible{display:block;}

  /* nav buttons */
  .step-nav{display:flex; justify-content:space-between; margin-top:26px;}
  .nav-btn{
    font-family:var(--font-body); font-weight:700; font-size:.86rem;
    padding:11px 20px; border-radius:8px; cursor:pointer; border:1px solid transparent;
    transition:background .15s ease, border-color .15s ease;
  }
  .nav-btn.primary{background:var(--navy); color:var(--white);}
  .nav-btn.primary:hover{background:var(--navy-light);}
  .nav-btn.secondary{background:var(--white); color:var(--navy); border-color:var(--border);}
  .nav-btn.secondary:hover{border-color:var(--navy);}
  .nav-btn:disabled{opacity:.35; cursor:default;}

  /* storage warning banner */
  .storage-warning{
    grid-column:1/-1;
    background:var(--brick);
    color:var(--white);
    font-family:var(--font-mono);
    font-size:.72rem;
    padding:8px 24px;
    text-align:center;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   STORAGE LAYER
   One key per prospect ("prospect:{id}"), personal to this
   browser profile, no login, no server — matches spec §5/§8:
   "Browser-based, single HTML file, no build step" and
   "Key-value storage, personal scope, per-prospect keys".
   Backed by localStorage so data survives across sessions on
   the same device without any backend.
   ============================================================ */
const STORAGE_PREFIX = 'prospect:';
let storageAvailable = true;

function storageProbe(){
  try{
    const testKey = '__mp_storage_probe__';
    localStorage.setItem(testKey, '1');
    localStorage.removeItem(testKey);
    return true;
  }catch(e){ return false; }
}

async function storageSafeGet(key){
  try{ return localStorage.getItem(key); }
  catch(e){ console.error('Read failed', e); return null; }
}
async function storageSafeSet(key, value){
  try{ localStorage.setItem(key, value); return true; }
  catch(e){ console.error('Save failed', e); return false; }
}
async function storageSafeList(prefix){
  try{
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(prefix)===0) keys.push(k);
    }
    return keys;
  }catch(e){ return []; }
}

/* ============================================================
   STATE
   ============================================================ */
const STEP_DEFS = [
  {key:'prospect', title:'Prospect & Use Case', desc:"Who's in the room, what we're solving"},
  {key:'without', title:'Without the Tool — Today', desc:"Current effort & cost"},
  {key:'with', title:'With MARKT-PILOT — Target', desc:"Effort after adoption, plus investment"},
  {key:'compare', title:'Before / After', desc:"The business case, side by side"},
  {key:'risks', title:'Risks & Roadmap', desc:"Objections, phased plan, summary"},
];

let currentStepIdx = 0;

async function loadAllProspects(){
  const keys = await storageSafeList(STORAGE_PREFIX);
  const list = [];
  for(const k of keys){
    const raw = await storageSafeGet(k);
    if(raw){ try{ list.push(JSON.parse(raw)); }catch(e){} }
  }
  list.sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));
  return list;
}

function scheduleSave(){
  clearTimeout(saveTimer);
  setSaveStatus('saving', 'Saving…');
  saveTimer = setTimeout(async ()=>{
    state.updatedAt = Date.now();
    const ok = await storageSafeSet(STORAGE_PREFIX+state.id, JSON.stringify(state));
    setSaveStatus(ok?'saved':'error', ok ? 'Saved · '+ new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : 'Save failed');
    await refreshProspectDropdown();
  }, 700);
}

function setSaveStatus(kind, text){
  const dot = document.getElementById('save-dot');
  const label = document.getElementById('save-label');
  if(dot) dot.className = 'save-dot ' + kind;
  if(label) label.textContent = text;
}

/* ============================================================
   CALCULATIONS
   ============================================================ */
function computeMetrics(s){
  const totalHoursOhne = s.steps.reduce((sum,st)=>sum+Number(st.hoursOhne||0),0);
  const totalHoursMit = s.steps.reduce((sum,st)=>sum+Number(st.hoursMit||0),0);
  const hoursSavedWeek = totalHoursOhne - totalHoursMit;
  const hoursSavedYear = hoursSavedWeek*52;
  const rate = Number(s.hourlyRate||0);
  const costOhneYear = totalHoursOhne*rate*52;
  const costMitYear = totalHoursMit*rate*52;
  const savingsYear = costOhneYear - costMitYear;
  const oneTime = Number(s.investmentOneTime||0);
  const recurring = Number(s.investmentRecurring||0);
  const totalCost3y = oneTime + recurring*3;
  const totalSavings3y = savingsYear*3;
  const net3y = totalSavings3y - totalCost3y;
  const roi3y = totalCost3y>0 ? (net3y/totalCost3y*100) : 0;
  const monthlyNet = (savingsYear - recurring)/12;
  const paybackMonths = monthlyNet>0 ? (oneTime/monthlyNet) : null;
  return {totalHoursOhne,totalHoursMit,hoursSavedWeek,hoursSavedYear,costOhneYear,costMitYear,savingsYear,oneTime,recurring,totalCost3y,totalSavings3y,net3y,roi3y,paybackMonths,rate};
}

function fmtEUR(v){ return new Intl.NumberFormat('en-GB',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v||0); }
function fmtNum(v,dec=1){ return new Intl.NumberFormat('en-GB',{maximumFractionDigits:dec,minimumFractionDigits:0}).format(v||0); }
function fmtPct(v){ return new Intl.NumberFormat('en-GB',{maximumFractionDigits:0}).format(v||0)+'%'; }

/* ---------- lightweight count-up animation ---------- */
function animateStat(el, targetValue, formatFn){
  if(!el) return;
  const prev = parseFloat(el.dataset.rawValue || '0');
  if(!isFinite(targetValue)) targetValue = 0;
  const start = performance.now();
  const duration = 450;
  function tick(now){
    const t = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-t,3);
    const current = prev + (targetValue-prev)*eased;
    el.textContent = formatFn(current);
    if(t<1){ requestAnimationFrame(tick); } else { el.dataset.rawValue = String(targetValue); el.textContent = formatFn(targetValue); }
  }
  requestAnimationFrame(tick);
}

async function onSelectProspect(e){

  const raw = await storageSafeGet(STORAGE_PREFIX+id);

async function onNewProspect(){

  state = fresh;
  currentStepIdx = 0;
  maxStepReached = 0;

function renderStep(){
  maxStepReached = Math.max(maxStepReached, currentStepIdx);
  const main = document.getElementById('main');
  const key = STEP_DEFS[currentStepIdx].key;
  let html = '';
  if(key==='prospect') html = stepProspectHTML();
  else if(key==='without') html = stepWithoutHTML();
  else if(key==='with') html = stepWithHTML();
  else if(key==='compare') html = stepCompareHTML();
  else if(key==='risks') html = stepRisksHTML();

  main.innerHTML = `<div class="step-panel">
    <div class="live-bar" id="live-bar"></div>
    <div class="step-content">
      ${html}
      <div class="step-nav">
        <button class="nav-btn secondary" id="nav-back" ${currentStepIdx===0?'disabled':''}>← Back</button>
        <button class="nav-btn primary" id="nav-next" ${currentStepIdx===STEP_DEFS.length-1?'disabled':''}>Next →</button>
      </div>
    </div>
  </div>`;

  const back = document.getElementById('nav-back');
  const next = document.getElementById('nav-next');
  if(back) back.addEventListener('click', ()=>{ currentStepIdx=Math.max(0,currentStepIdx-1); renderAll(); });
  if(next) next.addEventListener('click', ()=>{ currentStepIdx=Math.min(STEP_DEFS.length-1,currentStepIdx+1); renderAll(); });

  bindStepEvents(key);
  renderLiveBar();
  updateComputed();
}

    <div class="roadmap-card">
      <div class="roadmap-phase">${esc(p.phase)}</div>
      <input type="text" class="rm-title" data-field="rmTitle" data-rm-id="${p.id}" value="${esc(p.title)}">
      <input type="text" class="rm-duration" data-field="rmDuration" data-rm-id="${p.id}" value="${esc(p.duration)}">
      <textarea class="rm-desc" data-field="rmDesc" data-rm-id="${p.id}">${esc(p.description)}</textarea>
    </div>
  `).join('');
}

function removeStep(id){
  if(state.steps.length<=1) return;
  state.steps = state.steps.filter(s=>s.id!==id);
  renderStepsWithoutTable();
  updateComputed();
  scheduleSave();
}
function removeRisk(id){
  state.risks = state.risks.filter(r=>r.id!==id);
  renderRisksList();
  scheduleSave();
}

/* ============================================================
   EVENT BINDING (delegation) & COMPUTED UPDATES
   ============================================================ */
function bindStepEvents(key){
  if(key==='without'){
    renderStepsWithoutTable();
    document.getElementById('add-step-btn').addEventListener('click', ()=>{
      state.steps.push({id:uid('s'), name:'New step', hoursOhne:0, hoursMit:0});
      renderStepsWithoutTable(); updateComputed(); scheduleSave();
    });
  }
  if(key==='with'){
    renderStepsWithTable();
    const slider = document.getElementById('qa-slider');
    const valLabel = document.getElementById('qa-val');
    slider.addEventListener('input', ()=>{ valLabel.textContent = slider.value+'%'; });
    document.getElementById('qa-apply-btn').addEventListener('click', ()=>{
      const pct = Number(slider.value)/100;
      state.steps.forEach(s=>{ s.hoursMit = Math.max(0, Math.round(Number(s.hoursOhne)*(1-pct)*2)/2); });
      renderStepsWithTable(); updateComputed(); scheduleSave();
    });
  }
  if(key==='compare'){ renderCmpRows(); }
  if(key==='risks'){
    renderRisksList();
    renderRoadmap();
    document.getElementById('add-risk-btn').addEventListener('click', ()=>{
      state.risks.push({id:uid('r'), name:'New risk', mitigation:'', discussed:false});
      renderRisksList(); scheduleSave();
    });
    document.getElementById('copy-summary-btn').addEventListener('click', onCopySummary);
  }
}

function onFieldInput(e){
  const t = e.target;
  const field = t.dataset.field;
  if(!field) return;

  if(field in state && !t.dataset.stepId && !t.dataset.riskId && !t.dataset.rmId){
    state[field] = t.type==='number' ? Number(t.value) : t.value;
  } else if(t.dataset.stepId){
    const st = state.steps.find(s=>s.id===t.dataset.stepId);
    if(!st) return;
    if(field==='stepName') st.name = t.value;
    if(field==='hoursOhne') st.hoursOhne = Number(t.value);
    if(field==='hoursMit'){
      st.hoursMit = Number(t.value);
      const warnSlot = document.querySelector(`[data-warn-for="${st.id}"]`);
      if(warnSlot) warnSlot.innerHTML = stepRowWarning(st);
    }
  } else if(t.dataset.riskId){
    const r = state.risks.find(r=>r.id===t.dataset.riskId);
    if(!r) return;
    if(field==='riskName') r.name = t.value;
    if(field==='riskMitigation') r.mitigation = t.value;
    if(field==='riskDiscussed') r.discussed = t.checked;
  } else if(t.dataset.rmId){
    const p = state.roadmap.find(p=>p.id===t.dataset.rmId);
    if(!p) return;
    if(field==='rmTitle') p.title = t.value;
    if(field==='rmDuration') p.duration = t.value;
    if(field==='rmDesc') p.description = t.value;
  }
  updateComputed();
  scheduleSave();
}

function updateComputed(){
  const m = computeMetrics(state);
  const setVal = (sel,val)=>{ const el=document.querySelector(sel); if(el) el.textContent = val; };

  setVal('[data-calc="totalHoursOhne"]', fmtNum(m.totalHoursOhne)+' hrs/wk');
  setVal('[data-calc="costOhneYear"]', fmtEUR(m.costOhneYear));
  setVal('[data-calc="totalHoursMit"]', fmtNum(m.totalHoursMit)+' hrs/wk');
  setVal('[data-calc="costMitYear"]', fmtEUR(m.costMitYear));
  setVal('[data-calc="hoursSavedWeek"]', fmtNum(m.hoursSavedWeek)+' hrs/wk');

  const paybackText = m.paybackMonths!==null ? fmtNum(m.paybackMonths,1)+' mo' : '—';

  // live bar
  animateStat(document.getElementById('lb-hours'), m.hoursSavedYear, v=>fmtNum(v,0)+' hrs');
  animateStat(document.getElementById('lb-savings'), m.savingsYear, v=>fmtEUR(v));
  animateStat(document.getElementById('lb-roi'), m.roi3y, v=>fmtPct(v));
  const lbPayback = document.getElementById('lb-payback'); if(lbPayback) lbPayback.textContent = paybackText;

  // hero stats (step 4)
  const heroHours = document.getElementById('hero-hours');
  if(heroHours) animateStat(heroHours, m.hoursSavedYear, v=>fmtNum(v,0)+'<span class="hs-unit">hrs</span>');
  animateStat(document.getElementById('hero-savings'), m.savingsYear, v=>fmtEUR(v));
  animateStat(document.getElementById('hero-roi'), m.roi3y, v=>fmtPct(v));
  const heroPayback = document.getElementById('hero-payback'); if(heroPayback) heroPayback.textContent = paybackText;

  // closing strip (step 5)
  animateStat(document.getElementById('closing-savings'), m.savingsYear, v=>fmtEUR(v));
  animateStat(document.getElementById('closing-roi'), m.roi3y, v=>fmtPct(v));
  const closingPayback = document.getElementById('closing-payback'); if(closingPayback) closingPayback.textContent = paybackText;

  // aggregate bars on comparison step
  const maxHours = Math.max(m.totalHoursOhne, m.totalHoursMit, 1);
  const maxCost = Math.max(m.costOhneYear, m.costMitYear, 1);
  setBar('agg-hours-without', m.totalHoursOhne, maxHours, fmtNum(m.totalHoursOhne)+' hrs/wk');
  setBar('agg-hours-with', m.totalHoursMit, maxHours, fmtNum(m.totalHoursMit)+' hrs/wk');
  setBar('agg-cost-without', m.costOhneYear, maxCost, fmtEUR(m.costOhneYear));
  setBar('agg-cost-with', m.costMitYear, maxCost, fmtEUR(m.costMitYear));

  if(document.getElementById('cmp-rows')) renderCmpRows();
}

function setBar(id, val, max, label){
  const el = document.getElementById(id);
  if(!el) return;
  const pct = Math.max(6, Math.min(100,(val/max)*100));
  el.style.width = pct+'%';
  el.textContent = label;
}

/* ---------- copy summary ---------- */
function buildSummaryText(){
  const m = computeMetrics(state);
  const paybackText = m.paybackMonths!==null ? fmtNum(m.paybackMonths,1)+' months' : 'n/a';
  return [
    `Business Case — ${state.companyName || '(prospect)'}`,
    `Use case: ${state.useCaseTitle}`,
    `Industry: ${state.industry}`,
    ``,
    `Without tool: ${fmtNum(m.totalHoursOhne)} hrs/week · ${fmtEUR(m.costOhneYear)}/year`,
    `With MARKT-PILOT: ${fmtNum(m.totalHoursMit)} hrs/week · ${fmtEUR(m.costMitYear)}/year`,
    ``,
    `Time saved: ${fmtNum(m.hoursSavedYear,0)} hrs/year`,
    `Cost savings: ${fmtEUR(m.savingsYear)}/year`,
    `Payback: ${paybackText}`,
    `3-year ROI: ${fmtPct(m.roi3y)}`,
    ``,
    `Next step: ${state.nextStep}`,
  ].join('\n');
}

async function onCopySummary(){
  const text = buildSummaryText();
  const btn = document.getElementById('copy-summary-btn');
  const fallback = document.getElementById('summary-fallback');
  const note = document.getElementById('fallback-note');
  try{
    if(!navigator.clipboard) throw new Error('no clipboard api');
    await navigator.clipboard.writeText(text);
    if(btn){ const orig = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(()=>{btn.textContent = orig;}, 1800); }
    if(fallback) fallback.classList.remove('visible');
    if(note) note.classList.remove('visible');
  }catch(err){
    if(fallback){
      fallback.value = text;
      fallback.classList.add('visible');
      fallback.focus();
      fallback.select();
    }
    if(note) note.classList.add('visible');
  }
}

function esc(str){
  if(str===undefined || str===null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ============================================================
   INIT
   ============================================================ */
async function init(){
  storageAvailable = storageProbe();
  renderShell();
  const existing = await loadAllProspects();
  if(existing.length>0){
    state = existing[0];
  } else {
    state = defaultTemplate();
    await storageSafeSet(STORAGE_PREFIX+state.id, JSON.stringify(state));
  }
  renderAll();
}
init();
</script>
